# Baseline Translation Configuration

data:
  dataset_name: "kftt" 
  dataset_path: "data/kftt/orig"
  tokenized_path: "data/tokenized" 
  train_subset_size: 44000
  val_subset_size: 1170
  test_subset_size: 1160
  document_level: False
  context_window_size: 1 

model:
  model_name: "facebook/nllb-200-distilled-600M"
  src_lang: "jpn_Jpan"
  tgt_lang: "eng_Latn"
  max_length: 256

training:
  batch_size: 4
  epochs: 10
  learning_rate: 0.00002
  gradient_accumulation_steps: 4
  mixed_precision: False
  eval_steps: 100
  save_steps: 100
  logging_steps: 10
  output_dir: "./checkpoints"
